[package]
name = "agavelens-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Abhijeet Ashok Muneshwar <openingknots@gmail.com>"]
repository = "https://github.com/ABHIJEET-MUNESHWAR/AgaveLens"
description = "Composition root for AgaveLens: wires adapters into the analytics engine, serves the GraphQL API over axum, and provides a CLI (serve / analyze)."
default-run = "agavelens-node"

[lib]
name = "agavelens_node"
path = "src/lib.rs"

[[bin]]
name = "agavelens-node"
path = "src/main.rs"

[[bench]]
name = "aggregate_bench"
harness = false

[dependencies]
agavelens-types = { workspace = true }
agavelens-core = { workspace = true }
agavelens-infra = { workspace = true }
agavelens-api = { workspace = true }

axum = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
tower-http = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

clap = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
criterion = { workspace = true }
