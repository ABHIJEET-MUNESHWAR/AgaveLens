[package]
name = "agavelens-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Abhijeet Ashok Muneshwar <openingknots@gmail.com>"]
repository = "https://github.com/ABHIJEET-MUNESHWAR/AgaveLens"
description = "GraphQL read-API for AgaveLens: queries over analytics snapshots, per-validator and per-epoch reports, plus a batch ingest mutation."

[dependencies]
agavelens-types = { workspace = true }
agavelens-core = { workspace = true }
async-graphql = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
agavelens-infra = { workspace = true }
serde_json = { workspace = true }
